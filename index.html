<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Project | DynamoDB</title>
    <link rel="stylesheet" href="styles.css"> 
</head>
<body>

    <header>
        <span class="logo-text">Sample Website</span>
    </header>

    <div class="container">
        <h1>Web Form</h1>
        <p>Fill out the details below to test the AWS DynamoDB integration.</p>
        
        <form id="support-form">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="email@example.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="555-555-5555" required>
            </div>

            <div class="form-group">
                <label for="problem">Problem</label>
                <textarea id="problem" name="problem" rows="6" placeholder="Describe the issue..." required></textarea>
            </div>

            <button type="submit" id="submit-btn">Submit to AWS</button>
        </form>

        <div id="form-message" class="hidden"></div>
    </div>
    
    <footer>
        <p>&copy; 2026 AWS Project Portfolio</p>
    </footer>

    <script src="script.js" defer></script>
</body>
</html>
